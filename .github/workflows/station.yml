name: Weather Station Update

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may run this late; the script uses each record's own timestamp
  workflow_dispatch:

concurrency:
  group: weather-station
  cancel-in-progress: false

jobs:
  station:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Ambient Weather + run rain logic
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APP_KEY: ${{ secrets.AMBIENT_APP_KEY }}
          AMBIENT_MAC: ${{ secrets.AMBIENT_MAC }}
          STATION_TZ: ${{ vars.STATION_TZ }}
          STATION_NAME: ${{ vars.STATION_NAME }}
        run: node station/scripts/fetch_ambient.js

      - name: Commit station data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add station/data
          if git diff --staged --quiet; then echo "No new data"; exit 0; fi
          git commit -m "Station update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 5
          done
          exit 1
