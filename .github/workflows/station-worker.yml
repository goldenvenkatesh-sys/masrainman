name: Deploy Station Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['station/worker/**', '.github/workflows/station-worker.yml']
  workflow_dispatch:

concurrency:
  group: station-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: station/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.go == 'true'
        with:
          node-version: '22'

      - name: Install wrangler
        if: steps.check.outputs.go == 'true'
        run: npm install --no-audit --no-fund

      - name: Deploy
        id: deploy
        if: steps.check.outputs.go == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $url"

      - name: Set Worker secrets
        if: steps.check.outputs.go == 'true'
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APP_KEY: ${{ secrets.AMBIENT_APP_KEY }}
          AMBIENT_MAC: ${{ secrets.AMBIENT_MAC }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          for name in AMBIENT_API_KEY AMBIENT_APP_KEY AMBIENT_MAC UPLOAD_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" > /dev/null && echo "set $name"
            else
              echo "skip $name (not set)"
            fi
          done

      - name: Point the dashboard at the Worker
        if: steps.check.outputs.go == 'true' && steps.deploy.outputs.url != ''
        working-directory: .
        run: |
          printf '{ "api": "%s" }\n' "${{ steps.deploy.outputs.url }}" > station/config.json
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add station/config.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Station: use Worker API ${{ steps.deploy.outputs.url }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
