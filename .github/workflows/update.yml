name: Auto-Update Weather Data

on:
  schedule:
    # Precision schedule to bypass GitHub queues and catch Open-Meteo's 7-hour processing delay
    - cron: '30 1,3,7,9,13,15,19,21 * * *'
  workflow_dispatch:       

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Data Fetcher
        run: python update.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch latest model runs [skip ci]" && git push)
