name: Auto-Update Weather Data

on:
  schedule:
    - cron: '0 */2 * * *'  # Force checks the servers every 2 hours
  workflow_dispatch:       # Allows manual trigger button

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Data Fetcher
        run: python update.py

      - name: Smart Commit (Only push if data is new)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch latest model runs [skip ci]" && git push)
