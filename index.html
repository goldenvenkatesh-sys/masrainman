<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MasRainman 24-Hour Rainfall Forecast</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header><h1>24-Hour Rainfall Forecast</h1><div id="time">Loading…</div></header>
  <main>
    <aside>
      <h2>Models</h2>
      <label><input type="checkbox" class="model" value="ECMWF HRES" checked> ECMWF HRES</label>
      <label><input type="checkbox" class="model" value="GEM" checked> GEM</label>
      <label><input type="checkbox" class="model" value="GFS" checked> GFS</label>
      <label><input type="checkbox" class="model" value="ICON" checked> ICON</label>
      <hr>
      <div class="aifs-heading">AIFS Set</div>
      <label><input type="radio" name="rainSet" value="standard" checked> Standard model blend</label>
      <label><input type="radio" name="rainSet" value="aifs"> AIFS Set — independent</label>
      <label id="aifsModelWrap" style="display:none">AIFS model<select id="aifsModel"></select></label>
      <label>Forecast day<select id="period"></select></label>
      <label>Transparency <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.8"></label>
      <p class="note">Rainfall is accumulated for each forecast day. Source: Open-Meteo model-specific APIs.</p>
    </aside>
    <section><div id="map"></div><div id="legend"></div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
